services:
  - type: web
    name: academic-helpdesk-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: bash render-start.sh
    healthCheckPath: /health
    disk:
      name: academic-helpdesk-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: CHROMA_DIR
        value: /var/data/chroma
      - key: CHUNKS_JSON
        value: /var/data/chunks.json
